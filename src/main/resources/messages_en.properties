# Kit descriptions
kit.default.description=A balanced starting kit for everyone.
kit.explosive_archer.description=Explosive arrows! Each arrow creates a 2.5 block explosion dealing 6 hearts of damage and knocking back enemies.
kit.enderman.description=Teleport around with ender pearls and confuse your enemies.
kit.knockback_warrior.description=Push your enemies off edges! Wield the mighty 'Big Stick'.
kit.tank.description=Absorb damage and protect your team. Very slow but sturdy. (Permanent Slowness I & Resistance I)
kit.ninja.description=Advanced stealth! Double-sneak for invisibility (6s) + Speed II + Night Vision. Cooldown: 25s.
kit.archer.description=A classic ranged kit with a powerful bow.
kit.berserker.description=Conditional rage! Gains Strength I + Speed I at 50% health, Strength II at 25% health. The more dangerous, the more powerful!
kit.chemist.description=Use harmful splash potions to weaken your foes from a distance. Poison, instant damage and slowness!
kit.assassin.description=Sneak attack! Double-sneak for invisibility (6s). First hit after invisibility = 200% damage! Cooldown: 20s.
kit.miner.description=Quickly gather resources and build defenses. Starts with an efficient pickaxe.
kit.vampire.description=Powerful lifesteal! Recovers 50% of damage dealt as health (max 2 hearts). 25% chance to inflict Weakness on victims.
kit.frost_mage.description=Ice mastery! Passive: Speed II on ice. Active: Ice bridge (20 blocks) + freeze zone (Slowness III). Cooldown: 8s.
kit.juggernaut.description=Unstoppable force! Extremely tanky and strong, but very slow. (Permanent Slowness II & Resistance II)
kit.trapper.description=Set up deadly traps for unsuspecting foes. Good for area denial.
kit.alchemist.description=Smart brewing! 4 random potions: Combat (Strength II + Resistance), Mobility (Speed III + Jump), Healing (Regen III + Absorption), Tactical (Invisibility + Night Vision). Cooldown: 12s.

