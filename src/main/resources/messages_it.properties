# Kit descriptions
kit.default.description=Un kit iniziale equilibrato per tutti.
kit.explosive_archer.description=Frecce esplosive! Ogni freccia crea un'esplosione di 2,5 blocchi che infligge 6 cuori di danno e respinge i nemici.
kit.enderman.description=Teletrasportati con le perle dell'Ender e confondi i tuoi nemici.
kit.knockback_warrior.description=Spingi i nemici fuori dai bordi! Impugna la potente 'Grande Bacchetta'.
kit.tank.description=Assorbi danni e proteggi il tuo team. Molto lento ma robusto. (Rallentamento I permanente & Resistenza I)
kit.ninja.description=Furtività avanzata! Doppio crouch per invisibilità (6s) + Velocità II + Visione Notturna. Tempo di ricarica: 25s.
kit.archer.description=Un kit da lontano classico con un potente arco.
kit.berserker.description=Furia condizionale! Ottiene Forza I + Velocità I al 50% della salute, Forza II al 25% della salute. Più è pericoloso, più è potente!
kit.chemist.description=Usa pozioni lanciabili dannose per indebolire i tuoi nemici a distanza. Veleno, danno istantaneo e rallentamento!
kit.assassin.description=Attacco a sorpresa! Doppio crouch per invisibilità (6s). Primo colpo dopo l'invisibilità = 200% di danno! Tempo di ricarica: 20s.
kit.miner.description=Raccogli rapidamente risorse e costruisci difese. Inizia con un piccone efficiente.
kit.vampire.description=Poderoso lifesteal! Recupera il 50% del danno inflitto come salute (max 2 cuori). 25% di probabilità di infliggere Debolezza alle vittime.
kit.frost_mage.description=Dominio del ghiaccio! Passivo: Velocità II sul ghiaccio. Attivo: Ponte di ghiaccio (20 blocchi) + zona di congelamento (Rallentamento III). Tempo di ricarica: 8s.
kit.juggernaut.description=Forza inarrestabile! Estremamente robusto e forte, ma molto lento. (Rallentamento II permanente & Resistenza II)
kit.trapper.description=Imposta trappole letali per nemici inconsapevoli. Buono per il controllo dell'area.
kit.alchemist.description=Preparazione intelligente! 4 pozioni casuali: Combattimento (Forza II + Resistenza), Mobilità (Velocità III + Salto), Guarigione (Rigenerazione III + Assorbimento), Tattico (Invisibilità + Visione Notturna). Tempo di ricarica: 12s.

