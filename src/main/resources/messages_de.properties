# Kit descriptions
kit.default.description=Eines ausgeglichenes Start-Kit für alle.
kit.explosive_archer.description=Explosiv-Pfeile! Jeder Pfeil löst eine 2,5 Block Explosion aus mit 6 Herzen Schaden und Rückstoß.
kit.enderman.description=Teleportiere dich mit Enderperlen und verwirre deine Gegner.
kit.knockback_warrior.description=Schlag deine Feinde von Kanten! Schwingen den mächtigen 'Großen Stock'.
kit.tank.description=Nimm Schaden auf und schütze dein Team. Sehr langsam, aber stabil. (Permanente Langsamkeit I & Resistenz I)
kit.ninja.description=Erweiterte Tarnung! Doppel-Leise-Schritte für Unsichtbarkeit (6s) + Geschwindigkeit II + Nachtsicht. Cooldown: 25s.
kit.archer.description=Ein klassisches Fernkampf-Kit mit einem starken Bogen.
kit.berserker.description=Bedingte Wut! Erhält Stärke I + Geschwindigkeit I bei 50% Gesundheit, Stärke II bei 25% Gesundheit. Je gefährlicher, desto stärker!
kit.chemist.description=Benutze schädliche Splittertränke, um Gegner aus der Ferne zu schwächen. Gift, Sofort-Schaden und Langsamkeit!
kit.assassin.description=Überfall! Doppel-Leise-Schritte für Unsichtbarkeit (6s). Erster Treffer nach Unsichtbarkeit = 200% Schaden! Cooldown: 20s.
kit.miner.description=Sammle schnell Ressourcen und baue Verteidigungen. Startet mit einer effizienten Spitzhacke.
kit.vampire.description=Starker Lebensraub! Stellt 50% des verursachten Schadens als Gesundheit wieder her (max. 2 Herzen). 25% Chance, Schwäche zu inflictieren.
kit.frost_mage.description=Eisbeherrschung! Passiv: Geschwindigkeit II auf Eis. Aktiv: Eisbrücke (20 Blöcke) + Einfrierzone (Langsamkeit III). Cooldown: 8s.
kit.juggernaut.description=Unaufhaltsame Kraft! Extrem robust und stark, aber sehr langsam. (Permanente Langsamkeit II & Resistenz II)
kit.trapper.description=Stelle tödliche Fallen für ahnungslose Feinde auf. Gut für Gebietssperren.
kit.alchemist.description=Intelligentes Brauen! 4 zufällige Tränke: Kampf (Stärke II + Resistenz), Mobilität (Geschwindigkeit III + Sprung), Heilung (Regen III + Absorption), Taktik (Unsichtbarkeit + Nachtsicht). Cooldown: 12s.

