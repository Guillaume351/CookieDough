# Kit descriptions
kit.default.description=Балансиран начален комплект за всеки.
kit.explosive_archer.description=Взривни стрели! Всяка стрела създава взрив с размер 2,5 блока, нанасящ 6 сърца щета и отблъскващ враговете.
kit.enderman.description=Телепортирай се с ендър перли и обърквай враговете си.
kit.knockback_warrior.description=Избутвайте враговете си от ръбове! Владеейте могъщото 'Голямо Пръчка'.
kit.tank.description=Поемете щети и защитавайте отбора си. Много бавен, но здрав. (Постоянна бавност I и устойчивост I)
kit.ninja.description=Разширено прикритие! Двойно скриване за невидимост (6с) + Скорост II + Нощно виждане. Време за презареждане: 25с.
kit.archer.description=Класически комплект за далечно нападение с мощен лък.
kit.berserker.description=Условен яд! Получава Сила I + Скорост I при 50% здраве, Сила II при 25% здраве. Колкото по-опасен, толкова по-мощен!
kit.chemist.description=Използвайте вредни експлозивни отвари, за да отслабите враговете си от разстояние. Отрова, моментални щети и бавност!
kit.assassin.description=Засада! Двойно скриване за невидимост (6с). Първият удар след невидимост = 200% щети! Време за презареждане: 20с.
kit.miner.description=Бързо събиране на ресурси и изграждане на защитни съоръжения. Започва с ефективен кирка.
kit.vampire.description=Мощно възстановяване на живот! Възстановява 50% от нанесените щети като здраве (макс. 2 сърца). 25% шанс да причини Слабост на жертвите.
kit.frost_mage.description=Майсторство на леда! Пасивно: Скорост II на лед. Активно: Леден мост (20 блока) + зона на замръзване (Бавене III). Време за презареждане: 8с.
kit.juggernaut.description=Неудържима сила! Изключително издръжлив и силен, но много бавен. (Постоянно Бавене II и Съпротивление II)
kit.trapper.description=Поставяйте смъртоносни капани за неочакващи се врагове. Добър за блокиране на зона.
kit.alchemist.description=Умело варене! 4 произволни отвари: Бойна (Сила II + Съпротивление), Мобилност (Скорост III + Скок), Лечение (Регенерация III + Абсорбция), Тактическа (Невидимост + Нощно виждане). Време за презареждане: 12с.

