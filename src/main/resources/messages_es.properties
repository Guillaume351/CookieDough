# Descripción de kits
kit.default.description=Un kit inicial equilibrado para todo el mundo.
kit.explosive_archer.description=¡Flechas explosivas! Cada flecha crea una explosión de 2,5 bloques, inflige 6 corazones de daño y empuja a los enemigos.
kit.enderman.description=Teletranspórtate con perlas de ender y confunde a tus enemigos.
kit.knockback_warrior.description=¡Lanza a tus enemigos al vacío con el poderoso «Gran palo»!
kit.tank.description=Absorbe daño y protege a tu equipo. Muy lento, pero resistente. (Lentitud I y Resistencia I permanentes)
kit.ninja.description=¡Sigilo avanzado! Agáchate dos veces para obtener invisibilidad durante 6 s, Velocidad II y Visión nocturna. Recarga: 25 s.
kit.archer.description=Un kit clásico de combate a distancia con un arco potente.
kit.berserker.description=¡Furia progresiva! Obtienes Fuerza I y Velocidad I al 50 % de vida, y Fuerza II al 25 %. ¡Cuanto mayor sea el peligro, más fuerte serás!
kit.chemist.description=Usa pociones arrojadizas dañinas para debilitar a tus rivales a distancia: veneno, daño instantáneo y lentitud.
kit.assassin.description=¡Ataque sorpresa! Agáchate dos veces para obtener invisibilidad durante 6 s. El primer golpe inflige un 200 % de daño. Recarga: 20 s.
kit.miner.description=Consigue recursos rápidamente y construye defensas. Empiezas con un pico eficiente.
kit.vampire.description=¡Robo de vida potente! Recuperas el 50 % del daño infligido como vida, hasta 2 corazones. 25 % de probabilidad de aplicar Debilidad.
kit.frost_mage.description=¡Dominio del hielo! Pasiva: Velocidad II sobre hielo. Activa: puente de hielo de 20 bloques y zona helada con Lentitud III. Recarga: 8 s.
kit.juggernaut.description=¡Una fuerza imparable! Extremadamente resistente y fuerte, pero muy lento. (Lentitud II y Resistencia II permanentes)
kit.trapper.description=Coloca trampas mortales para controlar zonas y sorprender a tus rivales.
kit.alchemist.description=¡Alquimia experta! 4 pociones aleatorias: combate, movilidad, curación o táctica. Recarga: 12 s.

