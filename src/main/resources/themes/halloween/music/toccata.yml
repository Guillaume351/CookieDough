# Toccata et fugue en re mineur, BWV 565 (ouverture) — attribuee a J.-S. Bach
# (debut XVIIIe siecle), domaine public. Arrangement Cookie Build.
# Une unite = une double croche ; chaque phrase dure 44 unites (s2 : 42).
title: "Toccata en re mineur"
composer: "Jean-Sebastien Bach"
phrases:
  s1: "A5 G5 A5:10 r:4 G5 F5 E5 D5 C#5:6 D5:12 r:6"
  s2: "A4 G4 A4:10 r:4 E4 F4 C#4:6 D4:12 r:6"
  s3: "A3 G3 A3:10 r:4 G3 F3 E3 D3 C#3:6 D3:12 r:6"
  s3low: "A2 G2 A2:10 r:4 G2 F2 E2 D2 C#2:6 D2:12 r:6"
  dim: "C#4:2 E4:2 G4:2 A#4:2 C#5:2 E5:6 r:4 D4+F4+A4+D5:24"
voices:
  - instrument: flute
    play: "@2 $s1 r:42 r:44 r:44"
  - instrument: bit
    volume: 0.7
    transpose: -12
    play: "@2 $s1 r:42 r:44 r:44"
  - instrument: bit
    volume: 0.8
    play: "@2 r:44 $s2 r:44 $dim"
  - instrument: guitar
    play: "@2 r:44 r:42 $s3 r:44"
  - instrument: bass
    play: "@2 r:44 r:42 $s3low D2:44"
