# Mon beau sapin (O Tannenbaum) — air traditionnel allemand, domaine public.
# Arrangement Cookie Build en sol majeur, forme A A B A puis B A, valse
# a trois temps. Une unite = une double croche (3/4).
title: "Mon beau sapin (O Tannenbaum)"
composer: "Air traditionnel allemand"
phrases:
  pick: "D4:4"
  a: "G4:3 G4 G4:4 A4:4 | B4:3 B4 B4:6 B4:2 | A4:2 B4:2 C5:4 F#4:4"
  toA: "A4:4 G4:4 D4:4"
  toB: "A4:4 G4:4 r:2 D5:2"
  b: "D5:2 B4:2 E5:6 D5:2 | D5:2 C5:2 C5:6 C5:2 | C5:2 A4:2 D5:6 C5:2 | C5:2 B4:2 B4:4 D4:4"
  last: "A4:4 G4:8"
  half1: "$pick $a $toA $a $toB $b"
  half2: "$a $toB $b $a $last"
  kG: "r:4 G3+B3+D4:4 G3+B3+D4:4"
  kGD: "r:4 G3+B3+D4:4 F#3+A3+C4:4"
  kAD: "r:4 A3+C4+E4:4 F#3+A3+C4:4"
  kD: "r:4 F#3+A3+C4:4 F#3+A3+C4:4"
  chA: "$kGD $kG $kAD $kG"
  chB: "$kG $kD $kD $kG"
  chEnd: "$kGD $kG $kAD r:4 G3+B3+D4:8"
  bA: "G2:4 r:4 D3:4 | G2:4 r:4 D3:4 | A2:4 r:4 D3:4 | G2:4 r:4 D3:4"
  bB: "G2:4 r:4 D3:4 | D3:4 r:4 A2:4 | D3:4 r:4 A2:4 | G2:4 r:4 D3:4"
  bEnd: "G2:4 r:4 D3:4 | G2:4 r:4 D3:4 | A2:4 r:4 D3:4 | G2:12"
voices:
  - instrument: harp
    volume: 0.85
    play: "@3 $half1 $half2"
  - instrument: bell
    transpose: 24
    volume: 0.4
    play: "@3 r:148 $half2"
  - instrument: harp
    volume: 0.35
    play: "@3 r:4 $chA $chA $chB $chA $chB $chEnd"
  - instrument: bass
    volume: 0.65
    play: "@3 r:4 $bA $bA $bB $bA $bB $bEnd"
