name: CookieDough
version: '${version}'
main: com.cookiebuild.cookiedough.CookieDough
api-version: '26.2'
load: POSTWORLD
authors: [Guillaume Claverie]
description: New Cookie Build Core plugin
website: cookie-build.com
softdepend: [floodgate]
commands:
  lobby:
    description: Teleport to the lobby
    usage: /<command>
    aliases: [ hub ]
  messagetest:
    description: Test the automatic message scheduler
    usage: /<command> [send|status|info]
    permission: cookiedough.admin
  sessiondiag:
    description: Diagnostic tool for player sessions
    usage: /<command> <player>
    permission: cookiedough.admin
  quickplay:
    description: Join the game closest to starting
    usage: /<command> [MicroBattles|Pitchout|SkyWars|BuildBattles|TurfWars|BedWars]
    aliases: [play]
  mute:
    description: Hide or show a player's messages for this session
    usage: /<command> <player>
  block:
    description: Persistently block or unblock a player across the game and app
    usage: /<command> <player>
  report:
    description: Report a player to the moderation team
    usage: /<command> <player> <reason>
  party:
    description: Create and manage a player party
    usage: /<command> [create|invite|join|leave|list]
  rally:
    description: Call opted-in players to an underfilled queue
    usage: /<command> [MicroBattles|Pitchout|SkyWars|BuildBattles|TurfWars|BedWars]
  practice:
    description: Toggle the solo reaction trainer
    usage: /<command>
  rules:
    description: Open the official Cookie Build server rules
    usage: /<command>
  events:
    description: Show the next community session or toggle reminders
    usage: /<command> [remind]
  goals:
    description: Show weekly objectives and achievements
    usage: /<command>
  friend:
    description: Create and manage friend relationships
    usage: /<command> [list|add <player>|accept <player>|deny <player>|remove <player>]
    aliases: [friends]
  menu:
    description: Open the Cookie Build player menu
    usage: /<command>
  feedback:
    description: Send feedback to the Cookie Build team
    usage: /<command> <message>
  app:
    description: Link or unlink your Cookie Build mobile app
    usage: /<command> [link|status|revoke]
  support:
    description: Create a private one-time code for the Cookie Build web shop
    usage: /<command> link
    permission: cookiedough.support.link
  cosmetics:
    aliases: [shop, boutique]
    description: Open the shop and equip your cosmetics
    usage: /<command>
  fly:
    description: Toggle entitled lobby-only flight
    usage: /<command>
permissions:
  cookiedough.support.link:
    description: Create a private one-time Cookie Build web shop code
    default: true
  cookiedough.flight.preserve:
    description: Prevent cosmetic cleanup from removing independently managed staff flight
    default: op
