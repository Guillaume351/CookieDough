# Descrição dos kits
kit.default.description=Um kit inicial equilibrado para todo mundo.
kit.explosive_archer.description=Flechas explosivas! Cada flecha cria uma explosão de 2,5 blocos, causa 6 corações de dano e empurra os inimigos.
kit.enderman.description=Teletransporte-se com pérolas do End e confunda seus inimigos.
kit.knockback_warrior.description=Empurre seus inimigos para fora com o poderoso “Bastão gigante”!
kit.tank.description=Absorva dano e proteja sua equipe. Muito lento, mas resistente. (Lentidão I e Resistência I permanentes)
kit.ninja.description=Furtividade avançada! Agache duas vezes para ficar invisível por 6 s e ganhar Velocidade II e Visão noturna. Recarga: 25 s.
kit.archer.description=Um kit clássico de combate à distância com um arco poderoso.
kit.berserker.description=Fúria progressiva! Ganhe Força I e Velocidade I com 50% de vida, depois Força II com 25%. Quanto maior o perigo, maior seu poder!
kit.chemist.description=Use poções arremessáveis nocivas para enfraquecer seus rivais à distância: veneno, dano instantâneo e lentidão.
kit.assassin.description=Ataque surpresa! Agache duas vezes para ficar invisível por 6 s. O primeiro golpe causa 200% de dano. Recarga: 20 s.
kit.miner.description=Obtenha recursos rapidamente e construa defesas. Você começa com uma picareta eficiente.
kit.vampire.description=Roubo de vida poderoso! Recupere 50% do dano causado como vida, até 2 corações. 25% de chance de aplicar Fraqueza.
kit.frost_mage.description=Domínio do gelo! Passiva: Velocidade II no gelo. Ativa: ponte de gelo de 20 blocos e área congelante com Lentidão III. Recarga: 8 s.
kit.juggernaut.description=Uma força imparável! Extremamente resistente e forte, mas muito lento. (Lentidão II e Resistência II permanentes)
kit.trapper.description=Monte armadilhas letais para controlar áreas e surpreender seus adversários.
kit.alchemist.description=Alquimia avançada! 4 poções aleatórias: combate, mobilidade, cura ou tática. Recarga: 12 s.

