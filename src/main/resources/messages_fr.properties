# Description des kits
kit.default.description=Un kit de départ équilibré pour tout le monde.
kit.explosive_archer.description=Des flèches explosives ! Chaque flèche crée une explosion de 2,5 blocs, inflige 6 cœurs de dégâts et repousse les ennemis.
kit.enderman.description=Téléporte-toi avec des perles de l’End et déroute tes ennemis.
kit.knockback_warrior.description=Projette tes ennemis dans le vide avec le redoutable « Gros bâton ».
kit.tank.description=Encaisse les dégâts et protège ton équipe. Très lent, mais résistant. (Lenteur I et Résistance I permanentes)
kit.ninja.description=Furtivité avancée ! Accroupis-toi deux fois pour devenir invisible pendant 6 s et obtenir Vitesse II et Vision nocturne. Recharge : 25 s.
kit.archer.description=Un kit classique de combat à distance avec un arc puissant.
kit.berserker.description=Rage progressive ! Force I et Vitesse I à 50 % de vie, puis Force II à 25 %. Plus le danger augmente, plus tu deviens puissant !
kit.chemist.description=Lance des potions nocives pour affaiblir tes adversaires à distance : poison, dégâts instantanés et lenteur.
kit.assassin.description=Attaque surprise ! Accroupis-toi deux fois pour devenir invisible pendant 6 s. Le premier coup inflige 200 % de dégâts. Recharge : 20 s.
kit.miner.description=Récolte rapidement des ressources et construis des défenses. Tu commences avec une pioche efficace.
kit.vampire.description=Vampirisme puissant ! Récupère 50 % des dégâts infligés en vie, jusqu’à 2 cœurs. 25 % de chances d’affaiblir la cible.
kit.frost_mage.description=Maîtrise de la glace ! Passif : Vitesse II sur la glace. Actif : pont de glace de 20 blocs et zone de gel avec Lenteur III. Recharge : 8 s.
kit.juggernaut.description=Une force imparable ! Extrêmement résistant et puissant, mais très lent. (Lenteur II et Résistance II permanentes)
kit.trapper.description=Pose des pièges mortels pour contrôler une zone et surprendre tes adversaires.
kit.alchemist.description=Alchimie experte ! 4 potions aléatoires : combat, mobilité, soin ou tactique. Recharge : 12 s.

