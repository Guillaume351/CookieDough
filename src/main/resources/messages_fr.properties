# Kit descriptions
kit.default.description=Un kit équilibré de départ pour tout le monde.
kit.explosive_archer.description=Flèches explosives ! Chaque flèche crée une explosion de 2.5 blocs infligeant 6 cœurs de dégâts et projetant les ennemis.
kit.enderman.description=Téléportez-vous avec des perles d'ender et semez la confusion chez vos ennemis.
kit.knockback_warrior.description=Poussez vos ennemis du bord ! Maniez le puissant 'Gros Bâton'.
kit.tank.description=Absorbez les dégâts et protégez votre équipe. Très lent mais résistant. (Slowness I & Resistance I permanents)
kit.ninja.description=Furtivité avancée ! Double-sneak pour invisibilité (6s) + Speed II + Night Vision. Cooldown: 25s.
kit.archer.description=Un kit à distance classique avec un arc puissant.
kit.berserker.description=Rage conditionnelle ! Gagne Strength I + Speed I à 50% de vie, Strength II à 25% de vie. Plus c'est dangereux, plus c'est puissant !
kit.chemist.description=Utilisez des potions splash nocives pour affaiblir vos ennemis à distance. Poison, dégâts instantanés et ralentissement !
kit.assassin.description=Attaque sournoise ! Double-sneak pour invisibilité (6s). Premier coup après invisibilité = 200% de dégâts ! Cooldown: 20s.
kit.miner.description=Récoltez rapidement des ressources et construisez des défenses. Commence avec une pioche efficace.
kit.vampire.description=Lifesteal puissant ! Récupère 50% des dégâts infligés en vie (max 2 cœurs). 25% de chance d'infliger Weakness aux victimes.
kit.frost_mage.description=Maîtrise de la glace ! Passif: Speed II sur glace. Actif: Pont de glace (20 blocs) + zone de gel (Slowness III). Cooldown: 8s.
kit.juggernaut.description=Force imparable ! Extrêmement résistant et fort, mais très lent. (Slowness II & Resistance II permanents)
kit.trapper.description=Installez des pièges mortels pour les ennemis imprudents. Bon pour le déni de zone.
kit.alchemist.description=Brassage intelligent ! 4 potions aléatoires: Combat (Strength II + Resistance), Mobilité (Speed III + Jump), Guérison (Regen III + Absorption), Tactique (Invisibilité + Night Vision). Cooldown: 12s.

