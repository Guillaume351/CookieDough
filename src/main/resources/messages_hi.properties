# Kit descriptions
kit.default.description=सभी के लिए एक संतुलित प्रारंभिक किट।
kit.explosive_archer.description=विस्फोटक तीर! प्रत्येक तीर 2.5 ब्लॉक का विस्फोट करता है जो 6 दिल का नुकसान करता है और दुश्मनों को पीछे धकेलता है।
kit.enderman.description=एंडर पर्ल के साथ टेलीपोर्ट करें और अपने दुश्मनों को भ्रमित करें।
kit.knockback_warrior.description=अपने दुश्मनों को किनारों से नीचे धकेलो! शक्तिशाली 'बिग स्टिक' का उपयोग करो।
kit.tank.description=नुकसान को अवशोषित करो और अपनी टीम की रक्षा करो। बहुत धीमा लेकिन मजबूत। (स्थायी सुस्ती I & प्रतिरोध I)
kit.ninja.description=उन्नत छुपाई! अदृश्यता (6s) + स्पीड II + नाइट विज़न के लिए डबल-स्नीक। कूलडाउन: 25s।
kit.archer.description=शक्तिशाली धनुष के साथ एक क्लासिक रेंज्ड किट।
kit.berserker.description=सशर्त क्रोध! 50% स्वास्थ्य पर स्ट्रेंथ I + स्पीड I प्राप्त करता है, 25% स्वास्थ्य पर स्ट्रेंथ II। जितना अधिक खतरनाक, उतना अधिक शक्तिशाली!
kit.chemist.description=अपने दुश्मनों को दूर से कमजोर करने के लिए हानिकारक स्प्लैश पोशन्स का उपयोग करो। जहर, तत्काल नुकसान और सुस्ती!
kit.assassin.description=छुपा हमला! अदृश्यता (6s) के लिए डबल-स्नीक। अदृश्यता के बाद पहला वार = 200% नुकसान! कूलडाउन: 20s।
kit.miner.description=जल्दी से संसाधन इकट्ठा करो और सुरक्षा बनाओ। एक कुशल पिकैक्स के साथ शुरू होता है।
kit.vampire.description=शक्तिशाली जीवन-चोरी! किए गए नुकसान का 50% स्वास्थ्य के रूप में पुनः प्राप्त करता है (अधिकतम 2 हार्ट)। पीड़ितों पर कमजोरी डालने की 25% संभावना।
kit.frost_mage.description=बर्फ में निपुणता! पैसिव: बर्फ पर स्पीड II। सक्रिय: बर्फ का पुल (20 ब्लॉक्स) + फ्रिज़ ज़ोन (धीमापन III)। कुलडडाउन: 8s।
kit.juggernaut.description=अविराम शक्ति! बेहद मजबूत और ताकतवर, लेकिन बहुत धीमा। (स्थायी धीमापन II और प्रतिरोध II)
kit.trapper.description=बिना संदेह वाले विरोधियों के लिए घातक जाल स्थापित करें। क्षेत्र अस्वीकार के लिए अच्छा।
kit.alchemist.description=स्मार्ट ब्रूइंग! 4 यादृच्छिक औषधियां: कम्बैट (स्ट्रेंथ II + प्रतिरोध), गति (स्पीड III + जंप), उपचार (रिजन III + एब्सॉर्पशन), सामरिक (अदृश्यता + नाइट विज़न)। कुलडडाउन: 12s।

