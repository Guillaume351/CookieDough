microbattles.kit.description.assassin=डबल-स्नीक स्टेल्थ एक सावधानीपूर्वक समयबद्ध घातक प्रहार को सक्षम करता है।
microbattles.kit.description.miner=तेज़ खनन और नक्शा नियंत्रण के लिए अतिरिक्त ब्लॉक्स, कमजोर लड़ाई के उपकरणों के साथ।
microbattles.kit.description.vampire=दुश्मन पर नज़दीकी वार करने से थोड़ा स्वास्थ्य वापस मिलता है।
microbattles.kit.description.frost_mage=स्नोबॉल दुश्मनों को धीमा करते हैं; छड़ी एक छोटा अस्थायी बर्फ का पुल बनाती है।
