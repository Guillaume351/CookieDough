microbattles.kit.description.trapper=संकरे रास्तों को नियंत्रित करने के लिए जाले और उपयोगी सामान देता है।
microbattles.kit.description.alchemist=ब्रीविंग स्टैंड एक यादृच्छिक छोटा स्वयं-बफ़ कूलडाउन पर प्रदान करता है।
