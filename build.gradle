plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.5.1'
}

group = 'com.cookie-build'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'

    // Hibernate dependencies
    implementation 'org.hibernate.orm:hibernate-core:7.4.5.Final'
    implementation('org.hibernate.orm:hibernate-hikaricp:7.4.5.Final') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    // Required by Hibernate's JSON SqlType mapper
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    // Database connector
    implementation 'org.postgresql:postgresql:42.7.11'

    // Paper provides the SLF4J API and logging implementation at runtime.
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // For RabbitMQ
    implementation('com.rabbitmq:amqp-client:5.33.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

test {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Disable the regular jar task since we're using shadowJar
jar {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.runtimeClasspath]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

// Make sure the build task uses shadowJar
build {
    dependsOn shadowJar
}

artifacts {
    shadow(shadowJar)
}
